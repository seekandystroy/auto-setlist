<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auto-setlist</title>
  <link rel="stylesheet" href="bulma.min.css">
</head>

<body>
  <section class="section">
    <div class="container" style="max-width: 480px">
      <h1 class="title">auto-setlist</h1>
      <p class="subtitle">Create a Spotify playlist from an artist's latest setlist.</p>

      <button id="connect" class="button is-rounded is-success is-medium" style="display:none">
        Connect to Spotify
      </button>

      <div id="main" style="display:none">
        <div class="field has-addons">
          <div class="control is-expanded">
            <input id="artist" class="input is-medium" type="text" maxlength="100" placeholder="Artist name">
          </div>
          <div class="control">
            <button id="submit" class="button is-primary is-medium" disabled>Create Playlist</button>
          </div>
        </div>

        <div class="field mt-3">
          <label class="checkbox">
            <input id="include-covers" type="checkbox" checked>
            Include covers' originals
          </label>
          <button
            title="When enabled, cover songs in the setlist use the original artist's version if the performing artist does not have a recording of that song."
            popovertarget="covers-info" class="tag is-rounded is-info is-light ml-2">?</button>
          <div id="covers-info" popover>
            When enabled, cover songs in the setlist are added to the playlist as the original artist's version if the
            performing artist does not have a recording of that song.
          </div>
        </div>

        <div id="result" class="mt-4"></div>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>

</html>
