<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>auto-setlist</title>
  <link rel="stylesheet" href="bulma.min.css">
  <script src="https://kit.fontawesome.com/97a45bdf33.js" crossorigin="anonymous"></script>
</head>

<body>
  <section class="section">
    <div class="container" style="max-width: 480px">
      <h1 class="title">auto-setlist</h1>
      <p class="subtitle">Spotify playlists from live setlists.</p>

      <div id="connect" style="display:none">
        <button id="connect-button" class="button is-rounded is-success is-medium">
          <span class="icon"><i class="fab fa-spotify"></i></span>
          <span>
            Connect to Spotify
          </span>
        </button>
        <div class="mt-4">
          <p>(auto-setlist does not store any personal information)</p>
        </div>
      </div>

      <div id="main" style="display:none">
        <div class="field has-addons">
          <div class="control is-expanded">
            <input id="artist" class="input is-medium" type="text" maxlength="100" placeholder="Artist name">
          </div>
          <div class="control">
            <button id="submit" class="button is-primary is-medium" disabled>Create Playlist</button>
          </div>
        </div>

        <div class="mt-3">
          <p>Songs from:</p>
          <div class="buttons has-addons">
            <button id="mode-latest" class="button is-selected is-primary">Latest show</button>
            <button id="mode-tour" class="button">Whole tour</button>
          </div>
        </div>

        <div id="result" class="mt-5 buttons is-centered"></div>
      </div>
    </div>
  </section>

  <script src="app.js"></script>
</body>

</html>
